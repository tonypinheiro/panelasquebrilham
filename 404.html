---
layout: null
---
{%- assign c = site.data.config -%}
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada | {{ c.nome | escape }}</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
  <style>
    @font-face { font-family: "Lilita One"; src: url({{ '/assets/fonts/lilita-one.woff2' | relative_url }}) format("woff2"); font-display: swap; }
    @font-face { font-family: "Nunito"; src: url({{ '/assets/fonts/nunito.woff2' | relative_url }}) format("woff2"); font-weight: 200 1000; font-display: swap; }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center;
           font: 17px/1.5 "Nunito", system-ui, sans-serif; color: #2E2018; background: #F7D046; }
    img { width: 96px; height: 96px; margin: 0 auto; }
    h1 { font-family: "Lilita One", sans-serif; font-weight: 400; font-size: 2.4rem; line-height: 1; color: #C62A1D; margin-top: 18px; }
    p { margin-top: 10px; }
    a { display: inline-flex; align-items: center; min-height: 56px; margin-top: 22px; padding: 0 24px; border-radius: 18px;
        background: #187A4A; color: #fff; font-weight: 900; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <img src="{{ '/assets/img/logo.webp' | relative_url }}" alt="{{ c.nome | escape }}">
    <h1>Essa página não existe</h1>
    <p>Mas a comida continua saindo. Volte para a página inicial para ver o cardápio e fazer seu pedido.</p>
    <a href="{{ '/' | relative_url }}">Ir para o início</a>
  </main>
</body>
</html>
